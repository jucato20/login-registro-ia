<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · AuthApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__logo">A</div>
        <span class="auth-brand__name">AuthApp</span>
      </div>

      <h1>Crea tu cuenta</h1>
      <span class="auth-card__subtitle">Completa tus datos para comenzar</span>

      <div id="formAlert" class="alert" hidden></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="field">
          <label for="fullName">Nombre completo</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Ej. Juan Camilo Torres" />
          <span class="field-error" id="err-fullName"></span>
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" />
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="field">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="Ej. juanc.torres" />
          <span class="field-error" id="err-username"></span>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="new-password" placeholder="Crea una contraseña segura" />
            <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Mostrar contraseña">👁</button>
          </div>
          <div class="strength-meter">
            <div class="strength-meter__bar" id="strengthBar"></div>
          </div>
          <span class="strength-label" id="strengthLabel">Muy débil</span>
          <ul class="password-checklist" id="passwordChecklist">
            <li data-check="length"><span class="check-icon">•</span> Mínimo 8 caracteres</li>
            <li data-check="upper"><span class="check-icon">•</span> Una mayúscula</li>
            <li data-check="lower"><span class="check-icon">•</span> Una minúscula</li>
            <li data-check="number"><span class="check-icon">•</span> Un número</li>
            <li data-check="special"><span class="check-icon">•</span> Un carácter especial</li>
          </ul>
          <span class="field-error" id="err-password"></span>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Repite tu contraseña" />
            <button type="button" class="toggle-visibility" id="toggleConfirmPassword" aria-label="Mostrar contraseña">👁</button>
          </div>
          <span class="field-error" id="err-confirmPassword"></span>
        </div>

        <div class="field">
          <label for="securityQuestion">Pregunta de seguridad</label>
          <select id="securityQuestion" name="securityQuestion">
            <option value="">Selecciona una pregunta</option>
            <option value="¿Cuál es el nombre de tu primera mascota?">¿Cuál es el nombre de tu primera mascota?</option>
            <option value="¿En qué ciudad naciste?">¿En qué ciudad naciste?</option>
            <option value="¿Cuál es tu comida favorita?">¿Cuál es tu comida favorita?</option>
            <option value="¿Cuál es el nombre de tu mejor amigo/a de la infancia?">¿Cuál es el nombre de tu mejor amigo/a de la infancia?</option>
            <option value="¿Cuál fue tu primer colegio?">¿Cuál fue tu primer colegio?</option>
          </select>
          <span class="hint">La usaremos para ayudarte a recuperar tu contraseña.</span>
          <span class="field-error" id="err-securityQuestion"></span>
        </div>

        <div class="field">
          <label for="securityAnswer">Respuesta</label>
          <input type="text" id="securityAnswer" name="securityAnswer" placeholder="Tu respuesta" />
          <span class="field-error" id="err-securityAnswer"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Crear cuenta</button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
