<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña · AuthApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__logo">A</div>
        <span class="auth-brand__name">AuthApp</span>
      </div>

      <h1>Recuperar contraseña</h1>
      <span class="auth-card__subtitle">Sigue los pasos para restablecer tu acceso</span>

      <div class="step-indicator">
        <span id="dot1" class="is-active"></span>
        <span id="dot2"></span>
        <span id="dot3"></span>
      </div>

      <div id="formAlert" class="alert" hidden></div>

      <!-- Paso 1: identificar usuario -->
      <form id="step1Form" class="auth-form">
        <div class="field">
          <label for="identifier">Usuario o correo electrónico</label>
          <input type="text" id="identifier" name="identifier" placeholder="usuario o correo@ejemplo.com" />
          <span class="field-error" id="err-identifier"></span>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Continuar</button>
      </form>

      <!-- Paso 2: pregunta de seguridad -->
      <form id="step2Form" class="auth-form" hidden>
        <div class="field">
          <label id="securityQuestionLabel">Pregunta de seguridad</label>
          <input type="text" id="securityAnswer" name="securityAnswer" placeholder="Tu respuesta" />
          <span class="field-error" id="err-securityAnswer"></span>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Verificar respuesta</button>
      </form>

      <!-- Paso 3: nueva contraseña -->
      <form id="step3Form" class="auth-form" hidden>
        <div class="field">
          <label for="newPassword">Nueva contraseña</label>
          <div class="input-wrap">
            <input type="password" id="newPassword" name="newPassword" placeholder="Crea una nueva contraseña" />
            <button type="button" class="toggle-visibility" id="toggleNewPassword" aria-label="Mostrar contraseña">👁</button>
          </div>
          <div class="strength-meter">
            <div class="strength-meter__bar" id="strengthBar"></div>
          </div>
          <span class="strength-label" id="strengthLabel">Muy débil</span>
          <ul class="password-checklist" id="passwordChecklist">
            <li data-check="length"><span class="check-icon">•</span> Mínimo 8 caracteres</li>
            <li data-check="upper"><span class="check-icon">•</span> Una mayúscula</li>
            <li data-check="lower"><span class="check-icon">•</span> Una minúscula</li>
            <li data-check="number"><span class="check-icon">•</span> Un número</li>
            <li data-check="special"><span class="check-icon">•</span> Un carácter especial</li>
          </ul>
          <span class="field-error" id="err-newPassword"></span>
        </div>

        <div class="field">
          <label for="confirmNewPassword">Confirmar nueva contraseña</label>
          <div class="input-wrap">
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Repite la nueva contraseña" />
            <button type="button" class="toggle-visibility" id="toggleConfirmNewPassword" aria-label="Mostrar contraseña">👁</button>
          </div>
          <span class="field-error" id="err-confirmNewPassword"></span>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Actualizar contraseña</button>
      </form>

      <div class="auth-footer">
        <a href="index.html">← Volver a iniciar sesión</a>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
